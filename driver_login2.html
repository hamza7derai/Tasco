<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TASCO | Driver Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --orange: #FF5A00;
            --orange-hover: #E04F00;
            --bg: #FFFFFF;
            --text-dark: #171717;
            --text-muted: #8A8A8A;
            --border: #EBEBEB;
            --input-bg: #FFFFFF;
            --font: "Montserrat", sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: var(--font); 
            background: var(--bg); 
            color: var(--text-dark); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            min-height: 100dvh;
            padding: 24px; 
            -webkit-font-smoothing: antialiased;
        }
        
        input, button { font-family: inherit; outline: none; border: none; background: none; }

        /* HEADER & LOGO */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 4vh;
            margin-bottom: 24px;
        }
        .logo-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-mark {
            color: var(--orange);
            width: 42px;
            height: auto;
        }
        .logo-text {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -1px;
            color: var(--text-dark);
        }
        .app-subtitle {
            color: var(--orange);
            font-size: 15px;
            font-weight: 700;
            margin-top: 4px;
        }

        /* ILLUSTRATION */
        .hero-illustration {
            width: 100%;
            max-width: 280px;
            height: auto;
            margin: 0 auto 24px auto;
            display: block;
        }

        /* TYPOGRAPHY */
        .welcome-title {
            font-size: 24px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }
        .welcome-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
            text-align: center;
            margin-bottom: 32px;
        }

        /* FORM STYLES */
        .login-container {
            width: 100%;
            max-width: 380px;
        }
        .input-group {
            position: relative;
            margin-bottom: 16px;
            border: 1.5px solid var(--border);
            border-radius: 16px;
            background: var(--input-bg);
            display: flex;
            align-items: center;
            padding: 8px 16px;
            transition: 0.2s ease;
        }
        .input-group:focus-within {
            border-color: var(--orange);
            box-shadow: 0 0 0 4px rgba(255, 90, 0, 0.1);
        }
        
        .input-icon {
            color: var(--text-dark);
            width: 22px;
            height: 22px;
            margin-right: 14px;
            flex-shrink: 0;
        }
        
        .input-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .input-label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 2px;
        }
        
        .form-input {
            width: 100%;
            font-size: 15px;
            font-weight: 700;
            color: var(--text-dark);
            padding: 4px 0;
        }
        .form-input::placeholder { color: #D1D5DB; font-weight: 500; }

        /* BUTTONS & LINKS */
        .link-text {
            color: var(--orange);
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            display: block;
            text-align: right;
            margin-bottom: 24px;
        }

        .btn-primary {
            width: 100%;
            padding: 18px;
            background: var(--orange);
            color: white;
            font-size: 16px;
            font-weight: 800;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 8px 20px rgba(255, 90, 0, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary:active { transform: scale(0.98); }
        .btn-primary:disabled { background: #E5E7EB; color: #9CA3AF; box-shadow: none; cursor: not-allowed; }

        .footer-text {
            margin-top: 32px;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
            text-align: center;
        }
        .footer-text a {
            color: var(--orange);
            font-weight: 700;
            text-decoration: none;
        }

        /* ALERTS & STATES */
        .error-msg {
            background: #FEE2E2;
            color: #EF4444;
            font-size: 12px;
            font-weight: 700;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 16px;
            text-align: center;
            display: none;
        }
        
        /* SPINNER */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .spinner {
            width: 20px; height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
        }

        /* STEP LOGIC */
        #step-otp { display: none; }
        
        /* RECAPTCHA CONTAINER */
        #recaptcha-container { margin-bottom: 16px; display: flex; justify-content: center; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-row">
            <svg class="logo-mark" viewBox="0 0 100 100" fill="currentColor">
                <path d="M78.5,21.5c-4.2-4.2-10.1-6.5-16-6.5H30.8c-2.3,0-4.2,1.9-4.2,4.2v8.5c0,2.3,1.9,4.2,4.2,4.2h31.7c2.1,0,3.9,1.1,4.9,2.8c1,1.7,0.8,3.9-0.4,5.4L44.8,68.6c-4.2,5.3-10.7,8.4-17.4,8.4H15.2c-2.3,0-4.2-1.9-4.2-4.2v-8.5c0-2.3,1.9-4.2,4.2-4.2h12.2c2.1,0,3.9-1.1,4.9-2.8c1-1.7,0.8-3.9-0.4-5.4L54.1,23.3C59,17.2,66.6,13.6,74.5,13.6h9.1c2.3,0,4.2,1.9,4.2,4.2v8.5C87.8,28.6,85.9,30.5,83.6,30.5z M84.8,77c0,2.3-1.9,4.2-4.2,4.2H48.8c-2.3,0-4.2-1.9-4.2-4.2v-8.5c0-2.3,1.9-4.2,4.2-4.2h31.7C82.9,64.2,84.8,66.1,84.8,68.4V77z"/>
            </svg>
            <div class="logo-text">TASCO</div>
        </div>
        <div class="app-subtitle">Driver App</div>
    </div>

    <svg class="hero-illustration" viewBox="0 0 400 250" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="50" y="80" width="30" height="120" rx="4" fill="#F3F4F6"/>
        <rect x="90" y="50" width="45" height="150" rx="4" fill="#E5E7EB"/>
        <rect x="145" y="100" width="35" height="100" rx="4" fill="#F3F4F6"/>
        <rect x="290" y="60" width="50" height="140" rx="4" fill="#E5E7EB"/>
        <path d="M320 120C320 120 340 100 340 80C340 68.9543 331.046 60 320 60C308.954 60 300 68.9543 300 80C300 100 320 120 320 120Z" fill="#FF5A00" fill-opacity="0.2"/>
        <circle cx="320" cy="80" r="6" fill="#FF5A00" fill-opacity="0.4"/>
        <path d="M120 200L280 200" stroke="#E5E7EB" stroke-width="4" stroke-linecap="round"/>
        <circle cx="160" cy="180" r="24" fill="#374151" stroke="#111827" stroke-width="6"/>
        <circle cx="260" cy="180" r="24" fill="#374151" stroke="#111827" stroke-width="6"/>
        <path d="M130 180C130 150 150 140 180 140H220L250 110H270L280 150C280 170 260 180 260 180H130Z" fill="#FF5A00"/>
        <rect x="120" y="100" width="50" height="40" rx="4" fill="#E04F00"/>
        <path d="M210 140V90C210 80 200 70 190 70C180 70 170 80 170 90V140" fill="#111827"/>
        <circle cx="190" cy="65" r="15" fill="#FCA5A5"/>
        <path d="M175 65C175 55 185 50 190 50C195 50 205 55 205 65" fill="#FF5A00"/>
    </svg>

    <div class="welcome-title">Welcome back!</div>
    <div class="welcome-subtitle">Sign in to continue delivering</div>

    <div class="login-container">
        <div class="error-msg" id="errorMsg">Error message here</div>

        <form id="step-phone">
            <div class="input-group">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                <div class="input-content">
                    <span class="input-label">Phone number</span>
                    <input type="tel" id="phoneNumber" class="form-input" placeholder="+212 6 00 00 00 00" required autocomplete="tel">
                </div>
            </div>

            <div id="recaptcha-container"></div>

            <button type="submit" class="btn-primary" id="btnPhone">
                <span id="btnPhoneText">Send Code</span>
                <div class="spinner" id="spinnerPhone"></div>
            </button>
        </form>

        <form id="step-otp">
            <div class="input-group">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                <div class="input-content">
                    <span class="input-label">SMS Code</span>
                    <input type="number" id="otpCode" class="form-input" placeholder="• • • • • •" required autocomplete="one-time-code">
                </div>
            </div>
            
            <a class="link-text" onclick="resetForm()">Change phone number?</a>

            <button type="submit" class="btn-primary" id="btnOtp">
                <span id="btnOtpText">Log In</span>
                <div class="spinner" id="spinnerOtp"></div>
            </button>
        </form>

        <div class="footer-text">
            Don't have an account? <a href="#">Contact support</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Firebase Setup
        const app = initializeApp({
            apiKey: "AIzaSyAaaR52bvyQfkxmZL16lcg4Bd4M76OtbI4",
            authDomain: "lesgo-cd7f9.firebaseapp.com",
            projectId: "lesgo-cd7f9"
        });
        const auth = getAuth(app);
        const db = getFirestore(app);

        // UI Elements
        const formPhone = document.getElementById('step-phone');
        const formOtp = document.getElementById('step-otp');
        const errorMsg = document.getElementById('errorMsg');
        
        let confirmationResult = null;

        // Init Recaptcha
        auth.useDeviceLanguage();
        window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
            'size': 'invisible',
            'callback': (response) => {
                // reCAPTCHA solved
            }
        });

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
        }

        window.resetForm = () => {
            formOtp.style.display = 'none';
            formPhone.style.display = 'block';
            errorMsg.style.display = 'none';
            document.getElementById('otpCode').value = '';
        };

        // Step 1: Request SMS
        formPhone.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';
            
            let phone = document.getElementById('phoneNumber').value.trim().replace(/\s+/g, '');
            if (!phone.startsWith('+')) {
                // Default to Morocco prefix if missing
                phone = '+212' + phone.replace(/^0/, ''); 
            }

            const btn = document.getElementById('btnPhone');
            const btnText = document.getElementById('btnPhoneText');
            const spinner = document.getElementById('spinnerPhone');

            btn.disabled = true;
            btnText.style.display = 'none';
            spinner.style.display = 'block';

            try {
                // Optional: Check if driver exists in Firestore BEFORE sending SMS to save money
                // const driverDoc = await getDoc(doc(db, "drivers", phone));
                // if (!driverDoc.exists() || !driverDoc.data().isActive) throw new Error("Accès refusé.");

                const appVerifier = window.recaptchaVerifier;
                confirmationResult = await signInWithPhoneNumber(auth, phone, appVerifier);
                
                // Transition to Step 2
                formPhone.style.display = 'none';
                formOtp.style.display = 'block';
            } catch (error) {
                console.error(error);
                showError("Error sending SMS. Please check the number.");
                // Reset reCAPTCHA if it fails
                if(window.recaptchaVerifier) window.recaptchaVerifier.render().then(widgetId => grecaptcha.reset(widgetId));
            } finally {
                btn.disabled = false;
                btnText.style.display = 'block';
                spinner.style.display = 'none';
            }
        });

        // Step 2: Verify Code
        formOtp.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';
            
            const code = document.getElementById('otpCode').value.trim();
            const btn = document.getElementById('btnOtp');
            const btnText = document.getElementById('btnOtpText');
            const spinner = document.getElementById('spinnerOtp');

            btn.disabled = true;
            btnText.style.display = 'none';
            spinner.style.display = 'block';

            try {
                const result = await confirmationResult.confirm(code);
                const user = result.user;

                // Final Verification: Check if they are actually a driver in the DB
                const driverDoc = await getDoc(doc(db, "drivers", user.phoneNumber));
                
                if (driverDoc.exists() && driverDoc.data().isActive) {
                    // Success! Store essential data and redirect
                    localStorage.setItem("drv", JSON.stringify({
                        name: driverDoc.data().name,
                        phone: driverDoc.data().phone
                    }));
                    window.location.href = "driver.html";
                } else {
                    // Not an active driver
                    await auth.signOut();
                    showError("Account deactivated or not found.");
                    resetForm();
                }
            } catch (error) {
                console.error(error);
                showError("Invalid Code. Try again.");
            } finally {
                btn.disabled = false;
                btnText.style.display = 'block';
                spinner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
